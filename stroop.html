<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CogLab - Stroop Experiment</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>CogLab</h1>

        <h2>Stroop Experiment</h2>

        <p id="progress">
        Trial 0 / 24
        </p>

        <p>
            R = Red |
            G = Green |
            B = Blue
        </p>

        <button id="startStroopButton">
            Start Practice
        </button>

        <div
            id="wordStimulus"
            class="stroop-word hidden">
        </div>

        <p id="status">
            Ready.
        </p>
       <section
            id="statistics"
            class="hidden"
            aria-label="Experiment statistics"
        >

            <h3>Experiment Statistics</h3>

            <p
                id="statisticsContent"
                style="white-space: pre-line;"
            ></p>

        </section>

        <ul id="resultsList"></ul>

        <div id="exportControls" class="hidden">

            <button
                id="downloadStroopJson"
                type="button"
            >
                Download JSON
            </button>

            <button
                id="downloadStroopCsv"
                type="button"
            >
                Download CSV
            </button>

        </div>
    </main>

    <script src="stroop.js"></script>

</body>

</html>
