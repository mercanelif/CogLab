<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CogLab</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>CogLab</h1>

        <h2>Reaction Time Experiment</h2>

        <p>
            Press the button to start the experiment.
        </p>

        <button id="startButton">
            Start Experiment
        </button>

        <div id="stimulus" class="stimulus hidden"></div>

        <p id="status">
            Ready.
        </p>

        <p id="progress">
        Trial 0 / 5
        </p>

        <ul id="resultsList"></ul>
                
        <button id="downloadJsonButton" disabled>
        Download JSON
        </button>
        
    </main>

    <script src="app.js"></script>

</body>
</html>
